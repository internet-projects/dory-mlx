[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dory-mlx"
version = "0.1.0"
description = "NVIDIA Nemotron-Labs Dory 1.0 4B on Apple Silicon (MLX)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["mlx>=0.31", "mlx-lm", "transformers", "huggingface_hub"]

[project.optional-dependencies]
check = ["torch", "safetensors", "numpy"]

[tool.setuptools]
packages = ["dory_mlx"]
